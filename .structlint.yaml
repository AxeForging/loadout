dir_structure:
  allowedPaths:
    - "."
    - "cmd/**"
    - "internal/**"
    - "integration/**"
    - ".github/**"
    - "bin/**"
    - "dist/**"
    - "docs/**"
    - "web/**"
  requiredPaths:
    - "cmd/loadout/main.go"
    - "internal/app/app.go"
    - "internal/build/info.go"
    - "internal/cli/root.go"
    - "internal/domain/types.go"
    - "internal/store/store.go"
    - "internal/adapter/adapter.go"
    - "internal/engine/engine.go"
    - "internal/config/config.go"
    - "internal/logging/logging.go"
    - "Makefile"
    - "go.mod"

file_naming_pattern:
  allowed:
    - "*.go"
    - "*.mod"
    - "*.sum"
    - "*.yaml"
    - "*.yml"
    - "*.md"
    - "*.txt"
    - "*.json"
    - "*.sh"
    - "*.ts"
    - "*.tsx"
    - "*.css"
    - "*.html"
    - "*.js"
    - "*.svg"
    - "*.woff"
    - "*.woff2"
    - "*.gif"
    - "*.png"
    - "README*"
    - "LICENSE*"
    - "Makefile"
    - ".gitignore"
    - ".golangci.yml"
    - ".goreleaser.yml"
    - ".structlint.yaml"
    - ".impeccable.md"
    - "lefthook.yml"
  disallowed:
    - "*.env*"
    - ".env*"
    - "*.key"
    - "*.pem"
    - "*.log"
    - "*.tmp"
    - ".DS_Store"
    - "Thumbs.db"
  required:
    - "go.mod"
    - "README.md"
    - ".gitignore"
    - "*.go"

ignore:
  - ".git"
  - ".claude"
  - "vendor"
  - "node_modules"
  - "web/node_modules"
  - "web/tsconfig.tsbuildinfo"
  - "bin"
  - "dist"
